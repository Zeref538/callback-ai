<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>callback-ai</title>
<meta name="color-scheme" content="dark light">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --color-bg: #0F172A;
  --color-panel: #1E293B;
  --color-panel-2: #172033;
  --color-fg: #F8FAFC;
  --color-fg-muted: #94A3B8;
  --color-border: #334155;
  --color-accent: #22C55E;
  --color-accent-fg: #052e12;
  --color-warn: #F59E0B;
  --color-danger: #EF4444;
  --color-ring: #38BDF8;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --radius: 10px;
  --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px;
  --dur: 200ms;
}

:root[data-theme="light"] {
  --color-bg: #F8FAFC;
  --color-panel: #FFFFFF;
  --color-panel-2: #F1F5F9;
  --color-fg: #0F172A;
  --color-fg-muted: #475569;
  --color-border: #CBD5E1;
  --color-accent: #16A34A;
  --color-accent-fg: #FFFFFF;
  --color-warn: #B45309;
  --color-danger: #DC2626;
  --color-ring: #0284C7;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --color-bg: #F8FAFC; --color-panel: #FFFFFF; --color-panel-2: #F1F5F9;
    --color-fg: #0F172A; --color-fg-muted: #475569; --color-border: #CBD5E1;
    --color-accent: #16A34A; --color-accent-fg: #FFFFFF; --color-warn: #B45309; --color-danger: #DC2626;
    --color-ring: #0284C7;
  }
}

* { box-sizing: border-box; }
html, body { min-height: 100dvh; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-fg);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
}
h1, h2, h3, label, .mono { font-family: var(--font-mono); }

.shell {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--space-4) var(--space-3) var(--space-5);
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-4);
}
.brand { display: flex; align-items: center; gap: var(--space-2); }
.brand-mark {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--color-accent); color: var(--color-accent-fg);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 14px;
}
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
.brand-name .dim { color: var(--color-fg-muted); font-weight: 400; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 8px;
  border: 1px solid var(--color-border); background: var(--color-panel);
  color: var(--color-fg); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color var(--dur), transform 100ms;
}
.icon-btn:hover { border-color: var(--color-ring); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }

.card {
  background: var(--color-panel);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-4);
}
.card + .card { margin-top: var(--space-3); }

.field { margin-bottom: var(--space-3); }
.field label {
  display: flex; align-items: center; gap: var(--space-1);
  font-size: 13px; font-weight: 500; color: var(--color-fg-muted);
  margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.04em;
}
.field .optional { text-transform: none; font-weight: 400; opacity: 0.7; }
.field textarea, .field input[type="text"], .field input[type="url"] {
  width: 100%; background: var(--color-panel-2); color: var(--color-fg);
  border: 1px solid var(--color-border); border-radius: 8px;
  padding: var(--space-2) var(--space-3); font-family: var(--font-sans); font-size: 15px;
  resize: vertical; transition: border-color var(--dur), box-shadow var(--dur);
}
.field textarea:focus, .field input:focus {
  outline: none; border-color: var(--color-ring);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-ring) 25%, transparent);
}
.field .hint { font-size: 12px; color: var(--color-fg-muted); margin-top: var(--space-1); }

.persona-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2);
}
@media (max-width: 640px) { .persona-grid { grid-template-columns: 1fr; } }

.persona-card {
  text-align: left; cursor: pointer;
  background: var(--color-panel-2); border: 1px solid var(--color-border); border-radius: 8px;
  padding: var(--space-3); color: var(--color-fg);
  transition: border-color var(--dur), background var(--dur), transform 100ms;
}
.persona-card:hover { border-color: var(--color-ring); }
.persona-card:active { transform: scale(0.98); }
.persona-card:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
.persona-card[aria-pressed="true"] {
  border-color: var(--color-accent);
  background: color-mix(in srgb, var(--color-accent) 12%, var(--color-panel-2));
}
.persona-card .name { font-family: var(--font-mono); font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
.persona-card .desc { font-size: 12.5px; color: var(--color-fg-muted); line-height: 1.4; }

.btn-primary {
  width: 100%; padding: 12px var(--space-4); border-radius: 8px; border: none;
  background: var(--color-accent); color: var(--color-accent-fg);
  font-family: var(--font-sans); font-weight: 600; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  transition: filter var(--dur), transform 100ms;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-primary:active:not(:disabled) { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }

.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--color-accent-fg) 40%, transparent);
  border-top-color: var(--color-accent-fg);
  animation: spin 700ms linear infinite;
}
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1400ms; } }
@keyframes spin { to { transform: rotate(360deg); } }

.error-banner {
  background: color-mix(in srgb, var(--color-danger) 15%, var(--color-panel));
  border: 1px solid var(--color-danger); color: var(--color-fg);
  border-radius: 8px; padding: var(--space-2) var(--space-3); font-size: 14px;
  margin-bottom: var(--space-3); display: none;
}
.error-banner.show { display: block; }

.screen { display: none; }
.screen.active { display: block; animation: fadein var(--dur) ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }

/* --- Interview screen --- */
.progress-row { display: flex; gap: 6px; margin-bottom: var(--space-2); flex-wrap: wrap; }
.progress-dot {
  flex: 1; min-width: 18px; height: 6px; border-radius: 3px;
  background: var(--color-border); transition: background var(--dur);
}
.progress-dot.done { background: var(--color-fg-muted); }
.progress-dot.current { background: var(--color-ring); }
.progress-meta { font-size: 12.5px; color: var(--color-fg-muted); margin-bottom: var(--space-4); }
.progress-meta .competency { color: var(--color-fg); font-weight: 500; }

.transcript { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-4); }

.bubble-q {
  background: var(--color-panel); border: 1px solid var(--color-border); border-left: 3px solid var(--color-ring);
  border-radius: 8px; padding: var(--space-3);
}
.bubble-q .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-fg-muted); margin-bottom: 6px; }
.bubble-q .text { font-family: var(--font-mono); font-size: 14.5px; }

.bubble-a {
  background: var(--color-panel-2); border: 1px solid var(--color-border);
  border-radius: 8px; padding: var(--space-3); margin-left: var(--space-4);
}
.bubble-a .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-fg-muted); margin-bottom: 6px; }

.feedback {
  display: flex; align-items: flex-start; gap: var(--space-2);
  border-radius: 8px; padding: var(--space-2) var(--space-3); margin-left: var(--space-4);
  font-size: 13.5px; border: 1px solid var(--color-border);
}
.feedback svg { flex-shrink: 0; margin-top: 2px; width: 16px; height: 16px; }
.feedback.verdict-correct { border-color: color-mix(in srgb, var(--color-accent) 50%, var(--color-border)); }
.feedback.verdict-correct svg { color: var(--color-accent); }
.feedback.verdict-partial { border-color: color-mix(in srgb, var(--color-warn) 50%, var(--color-border)); }
.feedback.verdict-partial svg { color: var(--color-warn); }
.feedback.verdict-incomplete { border-color: color-mix(in srgb, var(--color-danger) 50%, var(--color-border)); }
.feedback.verdict-incomplete svg { color: var(--color-danger); }
.feedback .badge { font-family: var(--font-mono); font-weight: 600; text-transform: uppercase; font-size: 11px; margin-right: 6px; }
.feedback .low-conf { display: block; font-size: 11.5px; color: var(--color-fg-muted); margin-top: 2px; }

.answer-row { display: flex; gap: var(--space-2); position: sticky; bottom: var(--space-3); }
.answer-row textarea {
  flex: 1; background: var(--color-panel); color: var(--color-fg);
  border: 1px solid var(--color-border); border-radius: 8px; padding: var(--space-2) var(--space-3);
  font-family: var(--font-sans); font-size: 15px; resize: none; min-height: 48px;
}
.answer-row textarea:focus { outline: none; border-color: var(--color-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-ring) 25%, transparent); }
.send-btn {
  width: 48px; flex-shrink: 0; border-radius: 8px; border: none;
  background: var(--color-accent); color: var(--color-accent-fg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: filter var(--dur), transform 100ms;
}
.send-btn:hover:not(:disabled) { filter: brightness(1.08); }
.send-btn:active:not(:disabled) { transform: scale(0.96); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.send-btn:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }

/* --- Report screen --- */
.hero-stat { text-align: center; padding: var(--space-4) 0; }
.hero-stat .score { font-family: var(--font-mono); font-size: 44px; font-weight: 600; }
.hero-stat .label { color: var(--color-fg-muted); font-size: 13.5px; margin-top: 4px; }

.callout {
  background: color-mix(in srgb, var(--color-warn) 12%, var(--color-panel));
  border: 1px solid color-mix(in srgb, var(--color-warn) 45%, var(--color-border));
  border-radius: 8px; padding: var(--space-3); font-size: 14px; margin-bottom: var(--space-3);
}
.callout .title { font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; color: var(--color-warn); }

.competency-card { margin-bottom: var(--space-3); }
.competency-card .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-2); }
.competency-card .name { font-family: var(--font-mono); font-weight: 600; font-size: 14.5px; }
.competency-card .score-num { font-family: var(--font-mono); font-size: 14.5px; font-weight: 600; }
.meter { height: 8px; border-radius: 4px; background: var(--color-panel-2); overflow: hidden; margin-bottom: var(--space-2); }
.meter-fill { height: 100%; border-radius: 4px; transition: width 400ms ease-out; }
@media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } }
.quote {
  font-family: var(--font-mono); font-size: 13px; color: var(--color-fg-muted);
  border-left: 2px solid var(--color-border); padding-left: var(--space-2); margin: var(--space-2) 0;
}
.model-answer summary {
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--color-ring);
  list-style: none; display: flex; align-items: center; gap: 4px;
}
.model-answer summary::-webkit-details-marker { display: none; }
.model-answer summary svg { transition: transform var(--dur); width: 14px; height: 14px; }
.model-answer[open] summary svg { transform: rotate(90deg); }
.model-answer .content { font-size: 13.5px; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-panel-2); border-radius: 6px; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">&gt;_</div>
      <div class="brand-name">callback-ai <span class="dim">// adaptive interview simulator</span></div>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div id="error-banner" class="error-banner" role="alert"></div>

  <!-- ===== SETUP SCREEN ===== -->
  <section id="screen-setup" class="screen active" aria-labelledby="setup-heading">
    <h2 id="setup-heading" class="visually-hidden">Start a new interview session</h2>
    <form id="setup-form" class="card" novalidate>
      <div class="field">
        <label for="job-post">Job post</label>
        <textarea id="job-post" rows="5" placeholder="Paste the job posting text" required></textarea>
      </div>
      <div class="field">
        <label for="resume">Resume <span class="optional">(optional)</span></label>
        <textarea id="resume" rows="4" placeholder="Paste resume text"></textarea>
      </div>
      <div class="field">
        <label for="portfolio-link">Portfolio link <span class="optional">(optional)</span></label>
        <input id="portfolio-link" type="url" placeholder="https://your-portfolio.example">
        <div class="hint">Best-effort text extraction; JS-only sites may not parse.</div>
      </div>
      <div class="field">
        <label id="persona-label">Interviewer persona</label>
        <div class="persona-grid" role="group" aria-labelledby="persona-label">
          <button type="button" class="persona-card" data-persona="friendly" aria-pressed="false">
            <span class="name">Friendly</span>
            <span class="desc">Encouraging tone, softer follow-ups.</span>
          </button>
          <button type="button" class="persona-card" data-persona="neutral" aria-pressed="true">
            <span class="name">Neutral</span>
            <span class="desc">Plain, professional, standard probing.</span>
          </button>
          <button type="button" class="persona-card" data-persona="adversarial" aria-pressed="false">
            <span class="name">Adversarial</span>
            <span class="desc">Terse, skeptical, presses on vague numbers.</span>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="start-btn">
        <span id="start-btn-label">Start session</span>
      </button>
    </form>
  </section>

  <!-- ===== INTERVIEW SCREEN ===== -->
  <section id="screen-interview" class="screen" aria-labelledby="interview-heading">
    <h2 id="interview-heading" class="visually-hidden">Interview in progress</h2>
    <div class="progress-row" id="progress-row" aria-hidden="true"></div>
    <div class="progress-meta" id="progress-meta" role="status" aria-live="polite"></div>

    <div class="transcript" id="transcript"></div>

    <form id="answer-form" class="answer-row">
      <label for="answer-input" class="visually-hidden">Your answer</label>
      <textarea id="answer-input" rows="1" placeholder="Type your answer... (Enter to send, Shift+Enter for newline)"></textarea>
      <button type="submit" class="send-btn" id="send-btn" aria-label="Send answer">
        <svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </section>

  <!-- ===== REPORT SCREEN ===== -->
  <section id="screen-report" class="screen" aria-labelledby="report-heading">
    <h2 id="report-heading" class="visually-hidden">Session report</h2>
    <div class="card hero-stat">
      <div class="score" id="report-score">--</div>
      <div class="label">overall readiness</div>
    </div>
    <div id="report-callout"></div>
    <div id="report-competencies"></div>
  </section>

</div>

<script>
const API = "/api";
const state = { sessionId: null, persona: "neutral", competencies: [], budget: 0, turn: 0 };

const els = {
  errorBanner: document.getElementById("error-banner"),
  setupScreen: document.getElementById("screen-setup"),
  interviewScreen: document.getElementById("screen-interview"),
  reportScreen: document.getElementById("screen-report"),
  setupForm: document.getElementById("setup-form"),
  startBtn: document.getElementById("start-btn"),
  startBtnLabel: document.getElementById("start-btn-label"),
  progressRow: document.getElementById("progress-row"),
  progressMeta: document.getElementById("progress-meta"),
  transcript: document.getElementById("transcript"),
  answerForm: document.getElementById("answer-form"),
  answerInput: document.getElementById("answer-input"),
  sendBtn: document.getElementById("send-btn"),
  sendIcon: document.getElementById("send-icon"),
};

// ---- theme ----
const themeToggle = document.getElementById("theme-toggle");
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("callback-ai-theme", theme);
}
const savedTheme = localStorage.getItem("callback-ai-theme");
if (savedTheme) applyTheme(savedTheme);
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---- persona picker ----
document.querySelectorAll(".persona-card").forEach((card) => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".persona-card").forEach((c) => c.setAttribute("aria-pressed", "false"));
    card.setAttribute("aria-pressed", "true");
    state.persona = card.dataset.persona;
  });
});

function showError(message) {
  els.errorBanner.textContent = message;
  els.errorBanner.classList.add("show");
}
function clearError() { els.errorBanner.classList.remove("show"); }

function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

const SPINNER = '<span class="spinner" aria-hidden="true"></span>';

// ---- setup submit ----
els.setupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();
  const jobPost = document.getElementById("job-post").value.trim();
  if (!jobPost) { showError("Paste a job post before starting."); return; }

  els.startBtn.disabled = true;
  els.startBtnLabel.innerHTML = SPINNER + " Preparing rubric...";

  const body = {
    job_post: jobPost,
    resume: document.getElementById("resume").value.trim() || null,
    portfolio_link: document.getElementById("portfolio-link").value.trim() || null,
    persona: state.persona,
  };

  try {
    const resp = await fetch(`${API}/sessions`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!resp.ok) throw new Error((await resp.json()).detail || "Failed to start session.");
    const data = await resp.json();

    state.sessionId = data.session_id;
    state.competencies = data.competencies;
    state.turn = 1;

    if (data.conflicts) {
      const note = document.createElement("div");
      note.className = "feedback verdict-partial";
      note.style.marginLeft = "0";
      note.innerHTML = `<span class="badge">Note</span> ${data.conflicts} conflicting claim(s) found between your resume and portfolio -- fair game for follow-ups.`;
      els.transcript.appendChild(note);
    }

    renderProgress(data.competency);
    addQuestion(data.question);
    showScreen("screen-interview");
    els.answerInput.focus();
  } catch (err) {
    showError(err.message);
  } finally {
    els.startBtn.disabled = false;
    els.startBtnLabel.textContent = "Start session";
  }
});

// ---- progress indicator ----
function renderProgress(currentCompetency) {
  const budget = state.competencies.length ? Math.max(state.competencies.length, 12) : 12;
  els.progressRow.innerHTML = "";
  for (let i = 0; i < budget; i++) {
    const dot = document.createElement("div");
    dot.className = "progress-dot" + (i < state.turn - 1 ? " done" : i === state.turn - 1 ? " current" : "");
    els.progressRow.appendChild(dot);
  }
  els.progressMeta.innerHTML = `Question <strong>${state.turn}</strong> -- targeting <span class="competency">${currentCompetency || "..."}</span>`;
}

function addQuestion(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble-q";
  bubble.innerHTML = `<div class="role">Interviewer</div><div class="text"></div>`;
  bubble.querySelector(".text").textContent = text;
  els.transcript.appendChild(bubble);
  bubble.scrollIntoView({ behavior: "smooth", block: "end" });
}

function addAnswer(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble-a";
  bubble.innerHTML = `<div class="role">You</div><div class="text"></div>`;
  bubble.querySelector(".text").textContent = text;
  els.transcript.appendChild(bubble);
}

const VERDICT_ICONS = {
  correct: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  partial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  incomplete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
};

function addFeedback(feedbackText, lowConfidence) {
  // feedback_line already contains "[verdict] suggestion" from the backend
  const match = feedbackText.match(/\[(\w+)\]\s*(.*)/);
  const verdict = match ? match[1] : "partial";
  const message = match ? match[2] : feedbackText;

  const div = document.createElement("div");
  div.className = `feedback verdict-${verdict}`;
  div.setAttribute("role", "status");
  div.innerHTML = `${VERDICT_ICONS[verdict] || VERDICT_ICONS.partial}
    <span><span class="badge">${verdict}</span>${message}${lowConfidence ? '<span class="low-conf">Low confidence -- could not verify this against your answer.</span>' : ""}</span>`;
  els.transcript.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

// ---- answer submit ----
els.answerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const answer = els.answerInput.value.trim();
  if (!answer || !state.sessionId) return;
  clearError();

  addAnswer(answer);
  els.answerInput.value = "";
  els.sendBtn.disabled = true;
  els.answerInput.disabled = true;
  els.sendIcon.outerHTML = SPINNER;

  try {
    const resp = await fetch(`${API}/sessions/${state.sessionId}/answer`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || "Something went wrong.");
    const data = await resp.json();

    addFeedback(data.feedback, data.low_confidence);

    if (data.done) {
      els.answerForm.style.display = "none";
      await loadReport();
      showScreen("screen-report");
    } else {
      state.turn = data.turn + 1;
      renderProgress(data.next_competency);
      addQuestion(data.next_question);
    }
  } catch (err) {
    showError(err.message);
  } finally {
    els.sendBtn.disabled = false;
    els.answerInput.disabled = false;
    if (document.getElementById("send-icon") === null) {
      els.sendBtn.innerHTML = '<svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>';
    }
    els.answerInput.focus();
  }
});

els.answerInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    els.answerForm.requestSubmit();
  }
});

function meterColor(score) {
  if (score >= 0.7) return "var(--color-accent)";
  if (score >= 0.5) return "var(--color-warn)";
  return "var(--color-danger)";
}

async function loadReport() {
  const resp = await fetch(`${API}/sessions/${state.sessionId}/report`);
  if (!resp.ok) { showError("Could not load the report."); return; }
  const data = await resp.json();
  const report = data.report;

  document.getElementById("report-score").textContent =
    (report.competency_reports.reduce((s, r) => s + r.score, 0) / (report.competency_reports.length || 1)).toFixed(2);

  const calloutEl = document.getElementById("report-callout");
  if (report.top_fixes && report.top_fixes.length) {
    calloutEl.innerHTML = `<div class="callout"><div class="title">Top things to fix</div>${report.top_fixes.join(" &middot; ")}</div>`;
  }

  const list = document.getElementById("report-competencies");
  list.innerHTML = "";
  report.competency_reports.forEach((r) => {
    const pct = Math.round(r.score * 100);
    const card = document.createElement("div");
    card.className = "card competency-card";
    card.innerHTML = `
      <div class="head"><span class="name">${r.competency}</span><span class="score-num">${r.score.toFixed(2)}</span></div>
      <div class="meter"><div class="meter-fill" style="width:${pct}%; background:${meterColor(r.score)}"></div></div>
      <div class="quote">&ldquo;${r.evidence_quote}&rdquo;</div>
      ${r.low_confidence ? '<div class="low-conf">Low confidence score -- evidence could not be fully verified.</div>' : ""}
    `;
    if (report.model_answers && report.model_answers[r.competency]) {
      const details = document.createElement("details");
      details.className = "model-answer";
      details.innerHTML = `<summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg> Stronger answer</summary>
        <div class="content"></div>`;
      details.querySelector(".content").textContent = report.model_answers[r.competency];
      card.appendChild(details);
    }
    list.appendChild(card);
  });
}
</script>
