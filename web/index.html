<!doctype html>
<html lang="en" data-theme="dark-brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>callback-ai</title>
<meta name="color-scheme" content="dark light">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

/* Two custom daisyUI themes -- a dark OLED base with a run-green accent, and
   a real light counterpart (not just an inversion). daisyUI themes are just
   CSS custom properties scoped to [data-theme], so this layers on top of the
   library instead of fighting it. */
[data-theme="dark-brand"] {
  color-scheme: dark;
  --color-base-100: #0F172A;
  --color-base-200: #172033;
  --color-base-300: #1E293B;
  --color-base-content: #F8FAFC;
  --color-primary: #22C55E;
  --color-primary-content: #052e12;
  --color-secondary: #38BDF8;
  --color-secondary-content: #062533;
  --color-accent: #38BDF8;
  --color-neutral: #1E293B;
  --color-neutral-content: #F8FAFC;
  --color-info: #38BDF8;
  --color-success: #22C55E;
  --color-warning: #F59E0B;
  --color-error: #EF4444;
  --radius-box: 0.75rem;
  --radius-field: 0.5rem;
}
[data-theme="light-brand"] {
  color-scheme: light;
  --color-base-100: #FFFFFF;
  --color-base-200: #F1F5F9;
  --color-base-300: #E2E8F0;
  --color-base-content: #0F172A;
  --color-primary: #16A34A;
  --color-primary-content: #FFFFFF;
  --color-secondary: #0284C7;
  --color-secondary-content: #FFFFFF;
  --color-accent: #0284C7;
  --color-neutral: #E2E8F0;
  --color-neutral-content: #0F172A;
  --color-info: #0284C7;
  --color-success: #16A34A;
  --color-warning: #B45309;
  --color-error: #DC2626;
  --radius-box: 0.75rem;
  --radius-field: 0.5rem;
}

body { font-family: 'IBM Plex Sans', sans-serif; }
.font-brand-mono, h1, h2, h3, .label-text, .question-text, .competency-name, .score-num {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}

.screen { display: none; }
.screen.active { display: block; animation: fadein .2s ease-out; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }

.persona-card { cursor: pointer; text-align: left; transition: border-color .2s, background .2s; }

.progress-dots { display: flex; gap: 6px; }
.progress-dots .dot { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--color-base-content) 15%, transparent); }
.progress-dots .dot.done { background: color-mix(in srgb, var(--color-base-content) 45%, transparent); }
.progress-dots .dot.current { background: var(--color-secondary); }

.chat-bubble-quote { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; opacity: 0.8; border-left: 2px solid currentColor; padding-left: 0.6rem; }
.hero-score { font-size: 2.75rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>
<body class="min-h-dvh bg-base-100 text-base-content">
<div class="max-w-2xl mx-auto px-4 py-6">

  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary text-primary-content flex items-center justify-center font-brand-mono font-semibold text-sm" aria-hidden="true">&gt;_</div>
      <div class="font-brand-mono font-bold">callback-ai <span class="opacity-60 font-normal text-sm">// adaptive interview simulator</span></div>
    </div>
    <button class="btn btn-square btn-ghost" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div id="error-banner" class="alert alert-error mb-4 hidden" role="alert"></div>

  <!-- ===== SETUP SCREEN ===== -->
  <section id="screen-setup" class="screen active" aria-labelledby="setup-heading">
    <h2 id="setup-heading" class="visually-hidden">Start a new interview session</h2>
    <form id="setup-form" class="card bg-base-200 shadow-sm">
      <div class="card-body gap-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Job post</legend>
          <textarea id="job-post" class="textarea w-full" rows="5" placeholder="Paste the job posting text" required></textarea>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Resume <span class="opacity-60 font-normal">optional</span></legend>
          <textarea id="resume" class="textarea w-full" rows="4" placeholder="Paste resume text"></textarea>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Portfolio link <span class="opacity-60 font-normal">optional</span></legend>
          <input id="portfolio-link" type="url" class="input w-full" placeholder="https://your-portfolio.example">
          <p class="fieldset-label">Best-effort text extraction; JS-only sites may not parse.</p>
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend" id="persona-label">Interviewer persona</legend>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2" role="group" aria-labelledby="persona-label">
            <button type="button" class="card card-border persona-card p-3" data-persona="friendly" aria-pressed="false">
              <strong class="font-brand-mono text-sm">Friendly</strong>
              <span class="text-xs opacity-70">Encouraging tone, softer follow-ups.</span>
            </button>
            <button type="button" class="card card-border border-primary bg-primary/10 persona-card p-3" data-persona="neutral" aria-pressed="true">
              <strong class="font-brand-mono text-sm">Neutral</strong>
              <span class="text-xs opacity-70">Plain, professional, standard probing.</span>
            </button>
            <button type="button" class="card card-border persona-card p-3" data-persona="adversarial" aria-pressed="false">
              <strong class="font-brand-mono text-sm">Adversarial</strong>
              <span class="text-xs opacity-70">Terse, skeptical, presses on vague numbers.</span>
            </button>
          </div>
        </fieldset>
        <button type="submit" class="btn btn-primary w-full" id="start-btn">
          <span id="start-btn-label">Start session</span>
        </button>
      </div>
    </form>
  </section>

  <!-- ===== INTERVIEW SCREEN ===== -->
  <section id="screen-interview" class="screen" aria-labelledby="interview-heading">
    <h2 id="interview-heading" class="visually-hidden">Interview in progress</h2>
    <div class="progress-dots mb-2" id="progress-row" aria-hidden="true"></div>
    <div class="text-sm opacity-70 mb-4" id="progress-meta" role="status" aria-live="polite"></div>

    <div class="flex flex-col gap-1 mb-4" id="transcript"></div>

    <form id="answer-form" class="join w-full sticky bottom-4">
      <label for="answer-input" class="visually-hidden">Your answer</label>
      <textarea id="answer-input" class="textarea join-item w-full" rows="1" placeholder="Type your answer... (Enter to send, Shift+Enter for newline)"></textarea>
      <button type="submit" class="btn btn-primary join-item" id="send-btn" aria-label="Send answer">
        <svg id="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </section>

  <!-- ===== REPORT SCREEN ===== -->
  <section id="screen-report" class="screen" aria-labelledby="report-heading">
    <h2 id="report-heading" class="visually-hidden">Session report</h2>
    <div class="card bg-base-200 shadow-sm mb-4">
      <div class="card-body items-center text-center">
        <div class="hero-score" id="report-score">--</div>
        <div class="text-sm opacity-70">overall readiness</div>
      </div>
    </div>
    <div id="report-callout"></div>
    <div id="report-competencies" class="flex flex-col gap-3"></div>
  </section>

</div>

<script>
const API = "/api";
const state = { sessionId: null, persona: "neutral", competencies: [], budget: 0, turn: 0 };

const els = {
  errorBanner: document.getElementById("error-banner"),
  setupForm: document.getElementById("setup-form"),
  startBtn: document.getElementById("start-btn"),
  startBtnLabel: document.getElementById("start-btn-label"),
  progressRow: document.getElementById("progress-row"),
  progressMeta: document.getElementById("progress-meta"),
  transcript: document.getElementById("transcript"),
  answerForm: document.getElementById("answer-form"),
  answerInput: document.getElementById("answer-input"),
  sendBtn: document.getElementById("send-btn"),
};

// ---- theme ----
const themeToggle = document.getElementById("theme-toggle");
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme === "light" ? "light-brand" : "dark-brand");
  localStorage.setItem("callback-ai-theme", theme);
}
const savedTheme = localStorage.getItem("callback-ai-theme");
if (savedTheme) applyTheme(savedTheme);
else if (matchMedia("(prefers-color-scheme: light)").matches) applyTheme("light");
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") === "light-brand" ? "light" : "dark";
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---- persona picker ----
document.querySelectorAll(".persona-card").forEach((card) => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".persona-card").forEach((c) => {
      c.classList.remove("border-primary", "bg-primary/10");
      c.setAttribute("aria-pressed", "false");
    });
    card.classList.add("border-primary", "bg-primary/10");
    card.setAttribute("aria-pressed", "true");
    state.persona = card.dataset.persona;
  });
});

function showError(message) { els.errorBanner.textContent = message; els.errorBanner.classList.remove("hidden"); }
function clearError() { els.errorBanner.classList.add("hidden"); }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

const SPINNER = '<span class="loading loading-spinner loading-sm" aria-hidden="true"></span>';

// ---- setup submit ----
els.setupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();
  const jobPost = document.getElementById("job-post").value.trim();
  if (!jobPost) { showError("Paste a job post before starting."); return; }

  els.startBtn.disabled = true;
  els.startBtnLabel.innerHTML = SPINNER + " Preparing rubric...";

  const body = {
    job_post: jobPost,
    resume: document.getElementById("resume").value.trim() || null,
    portfolio_link: document.getElementById("portfolio-link").value.trim() || null,
    persona: state.persona,
  };

  try {
    const resp = await fetch(`${API}/sessions`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!resp.ok) throw new Error((await resp.json()).detail || "Failed to start session.");
    const data = await resp.json();

    state.sessionId = data.session_id;
    state.competencies = data.competencies;
    state.turn = 1;

    if (data.conflicts) {
      const note = document.createElement("div");
      note.className = "alert alert-warning mb-2";
      note.textContent = `Note: ${data.conflicts} conflicting claim(s) found between your resume and portfolio -- fair game for follow-ups.`;
      els.transcript.appendChild(note);
    }

    renderProgress(data.competency);
    addQuestion(data.question);
    showScreen("screen-interview");
    els.answerInput.focus();
  } catch (err) {
    showError(err.message);
  } finally {
    els.startBtn.disabled = false;
    els.startBtnLabel.textContent = "Start session";
  }
});

// ---- progress indicator ----
function renderProgress(currentCompetency) {
  const budget = state.competencies.length ? Math.max(state.competencies.length, 12) : 12;
  els.progressRow.innerHTML = "";
  for (let i = 0; i < budget; i++) {
    const dot = document.createElement("div");
    dot.className = "dot" + (i < state.turn - 1 ? " done" : i === state.turn - 1 ? " current" : "");
    els.progressRow.appendChild(dot);
  }
  els.progressMeta.innerHTML = `Question <strong>${state.turn}</strong> -- targeting <span class="text-base-content">${currentCompetency || "..."}</span>`;
}

function addQuestion(text) {
  const wrap = document.createElement("div");
  wrap.className = "chat chat-start";
  wrap.innerHTML = `<div class="chat-header opacity-60 text-xs">Interviewer</div>
    <div class="chat-bubble chat-bubble-neutral question-text text-sm"></div>`;
  wrap.querySelector(".question-text").textContent = text;
  els.transcript.appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "end" });
}

function addAnswer(text) {
  const wrap = document.createElement("div");
  wrap.className = "chat chat-end";
  wrap.innerHTML = `<div class="chat-header opacity-60 text-xs">You</div>
    <div class="chat-bubble chat-bubble-primary text-sm"></div>`;
  wrap.querySelector(".chat-bubble").textContent = text;
  els.transcript.appendChild(wrap);
}

const VERDICT_ICONS = {
  correct: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  partial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  incomplete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
};
const VERDICT_ALERT_CLASS = { correct: "alert-success", partial: "alert-warning", incomplete: "alert-error" };

function addFeedback(feedbackText, lowConfidence) {
  const match = feedbackText.match(/\[(\w+)\]\s*(.*)/);
  const verdict = match ? match[1] : "partial";
  const message = match ? match[2] : feedbackText;

  const div = document.createElement("div");
  div.className = `alert ${VERDICT_ALERT_CLASS[verdict] || "alert-warning"} items-start text-sm mb-2 ms-6`;
  div.setAttribute("role", "status");
  div.innerHTML = `${VERDICT_ICONS[verdict] || VERDICT_ICONS.partial}
    <span><span class="badge badge-ghost badge-sm uppercase me-1">${verdict}</span>${message}${lowConfidence ? '<span class="block text-xs opacity-70 mt-1">Low confidence -- could not verify this against your answer.</span>' : ""}</span>`;
  els.transcript.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

// ---- answer submit ----
els.answerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const answer = els.answerInput.value.trim();
  if (!answer || !state.sessionId) return;
  clearError();

  addAnswer(answer);
  els.answerInput.value = "";
  els.sendBtn.disabled = true;
  els.answerInput.disabled = true;
  const originalSendHtml = els.sendBtn.innerHTML;
  els.sendBtn.innerHTML = SPINNER;

  try {
    const resp = await fetch(`${API}/sessions/${state.sessionId}/answer`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || "Something went wrong.");
    const data = await resp.json();

    addFeedback(data.feedback, data.low_confidence);

    if (data.done) {
      els.answerForm.style.display = "none";
      await loadReport();
      showScreen("screen-report");
    } else {
      state.turn = data.turn + 1;
      renderProgress(data.next_competency);
      addQuestion(data.next_question);
    }
  } catch (err) {
    showError(err.message);
  } finally {
    els.sendBtn.disabled = false;
    els.answerInput.disabled = false;
    els.sendBtn.innerHTML = originalSendHtml;
    els.answerInput.focus();
  }
});

els.answerInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    els.answerForm.requestSubmit();
  }
});

function meterClass(score) {
  if (score >= 0.7) return "progress-success";
  if (score >= 0.5) return "progress-warning";
  return "progress-error";
}

async function loadReport() {
  const resp = await fetch(`${API}/sessions/${state.sessionId}/report`);
  if (!resp.ok) { showError("Could not load the report."); return; }
  const data = await resp.json();
  const report = data.report;

  document.getElementById("report-score").textContent =
    (report.competency_reports.reduce((s, r) => s + r.score, 0) / (report.competency_reports.length || 1)).toFixed(2);

  const calloutEl = document.getElementById("report-callout");
  if (report.top_fixes && report.top_fixes.length) {
    calloutEl.innerHTML = `<div class="alert alert-warning mb-4"><strong>Top things to fix:</strong> ${report.top_fixes.join(" &middot; ")}</div>`;
  }

  const list = document.getElementById("report-competencies");
  list.innerHTML = "";
  report.competency_reports.forEach((r) => {
    const pct = Math.round(r.score * 100);
    const card = document.createElement("div");
    card.className = "card bg-base-200 shadow-sm";
    card.innerHTML = `
      <div class="card-body">
        <div class="flex justify-between items-baseline mb-2">
          <span class="competency-name font-semibold text-sm">${r.competency}</span>
          <span class="score-num font-semibold text-sm">${r.score.toFixed(2)}</span>
        </div>
        <progress class="progress ${meterClass(r.score)} w-full" value="${pct}" max="100"></progress>
        <div class="chat-bubble-quote mt-2">&ldquo;${r.evidence_quote}&rdquo;</div>
        ${r.low_confidence ? '<div class="text-xs opacity-70 mt-1">Low confidence score -- evidence could not be fully verified.</div>' : ""}
      </div>
    `;
    if (report.model_answers && report.model_answers[r.competency]) {
      const details = document.createElement("details");
      details.className = "collapse collapse-arrow bg-base-300 mt-1";
      details.innerHTML = `<summary class="collapse-title text-sm font-medium min-h-0 py-2">Stronger answer</summary><div class="collapse-content text-sm"></div>`;
      details.querySelector(".collapse-content").textContent = report.model_answers[r.competency];
      card.querySelector(".card-body").appendChild(details);
    }
    list.appendChild(card);
  });
}
</script>
</body>
</html>
