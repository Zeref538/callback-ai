[project]
name = "callback-ai"
version = "1.0.0"
description = "Adaptive interview simulator agent: probes vague answers, budgets questions by uncertainty, grades with cited evidence."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# eval/ is a top-level package (not under src/), so put repo root + src on the
# path -- makes `pytest` and `python -m pytest` behave the same in CI and locally.
pythonpath = [".", "src"]
testpaths = ["tests"]

[project.scripts]
callback-ai = "callback_ai.cli.main:main"
callback-ai-serve = "callback_ai.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
